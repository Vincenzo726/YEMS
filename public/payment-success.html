<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Order Successful | YEMS PERFUME</title>

  <link
    rel="stylesheet"
    href="/css/style.css"
  />

  <link
    rel="stylesheet"
    href="/css/payment-success.css"
  />

</head>

<body>


  <!-- =====================================================
       SUCCESS PAGE
  ====================================================== -->

  <main class="payment-result-page">

    <section
      class="payment-result-card"
      id="statusCard"
    >


      <div
        class="payment-result-icon"
        id="statusIcon"
      >
        …
      </div>


      <p class="payment-result-eyebrow">
        YEMS PERFUME
      </p>


      <h1 id="statusTitle">
        Confirming your payment
      </h1>


      <p
        class="payment-result-text"
        id="statusText"
      >
        Please wait while we confirm your payment.
      </p>



      <!-- ORDER DETAILS -->

      <div class="payment-order-details">

        <div>

          <span>
            Order reference
          </span>

          <strong id="orderReference">
            —
          </strong>

        </div>


        <div>

          <span>
            Amount paid
          </span>

          <strong id="orderTotal">
            —
          </strong>

        </div>

      </div>



      <!-- WHATSAPP -->

      <a
        href="#"
        id="whatsappButton"
        class="success-action whatsapp-action hidden"
      >
        Continue to WhatsApp
      </a>


      <!-- HOME -->

      <a
        href="index.html"
        id="homeButton"
        class="success-action home-action"
      >
        Back to YEMS Homepage
      </a>


    </section>

  </main>


  <script src="/js/payment-success.js"></script>

</body>
</html>
